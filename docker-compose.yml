services:
  onto:
    build: .
    # Interactive CLI — keep stdin open and allocate a pseudo-TTY.
    stdin_open: true
    tty: true
    # Mount the host data directory so saves persist across container restarts.
    volumes:
      - ./data:/app/data
    environment:
      - ONTO_DATA_FILE=${ONTO_DATA_FILE}
      - ONTO_START_LOCATION=${ONTO_START_LOCATION}
    env_file:
      - .env
