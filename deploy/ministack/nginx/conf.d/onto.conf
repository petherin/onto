# onto.world → the SPA on S3.
#
# MiniStack's S3 website endpoint doesn't implement index-document serving, so
# we address objects path-style (/onto-web/<key>) which works reliably. S3
# ignores the Host header for path-style GETs, so no Host rewrite is needed;
# MiniStack only routes to the ALB when Host matches the ALB DNS (see api.conf),
# otherwise it treats the request as S3 — exactly what we want here.
server {
    listen 80;
    server_name onto.world;

    # The SPA's assets (app.js, logic.js, style.css, config.js, favicon.svg) use
    # relative URLs, so mapping / → /onto-web/ resolves them all under the bucket.
    location / {
        proxy_pass http://ministack:4566/onto-web/;
    }

    # Serve index.html at the site root.
    location = / {
        proxy_pass http://ministack:4566/onto-web/index.html;
    }
}
