<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onto Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; color: #c8d8f0; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  #ui { display: flex; height: 100vh; }
  #canvas-container { flex: 1; position: relative; }
  canvas { display: block; }

  #sidebar { width: 340px; display: flex; flex-direction: column; background: rgba(5,5,20,0.92); border-left: 1px solid #1a2a4a; z-index: 10; }

  #coord-panel { padding: 14px; border-bottom: 1px solid #1a2a4a; }
  #coord-panel h2 { font-size: 10px; letter-spacing: 3px; color: #4a7aaa; text-transform: uppercase; margin-bottom: 8px; }
  #onto-address { font-size: 9px; color: #6a9acc; word-break: break-all; margin-bottom: 10px; line-height: 1.4; }
  .coord-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
  .coord-label { color: #4a6a8a; }
  .coord-value { color: #8ab8e8; }
  #cost-display { margin-top: 8px; font-size: 11px; color: #f0c060; }

  #info-panel { padding: 14px; border-bottom: 1px solid #1a2a4a; flex: 0 0 auto; }
  #info-panel h2 { font-size: 10px; letter-spacing: 3px; color: #4a7aaa; text-transform: uppercase; margin-bottom: 8px; }
  #location-name { font-size: 15px; color: #e8f4ff; margin-bottom: 6px; font-weight: bold; }
  #location-desc { font-size: 11px; color: #7a9ab8; line-height: 1.5; }

  #exits-panel { padding: 14px; border-bottom: 1px solid #1a2a4a; }
  #exits-panel h2 { font-size: 10px; letter-spacing: 3px; color: #4a7aaa; text-transform: uppercase; margin-bottom: 8px; }
  .exit-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; margin-bottom: 4px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; font-size: 11px; }
  .exit-item:hover { border-color: #2a4a6a; background: rgba(42,74,106,0.3); }
  .exit-name { color: #c8e0f8; }
  .exit-mode { padding: 2px 6px; border-radius: 10px; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }

  #history-panel { padding: 14px; flex: 1; overflow-y: auto; min-height: 80px; }
  #history-panel h2 { font-size: 10px; letter-spacing: 3px; color: #4a7aaa; text-transform: uppercase; margin-bottom: 8px; }
  .history-item { font-size: 10px; color: #5a7a9a; padding: 2px 0; border-bottom: 1px solid #0d1a2a; }

  #command-area { padding: 10px 14px; border-top: 1px solid #1a2a4a; background: rgba(0,0,0,0.4); }
  #output { font-size: 10px; color: #6a9a7a; max-height: 80px; overflow-y: auto; margin-bottom: 8px; white-space: pre-wrap; line-height: 1.4; }
  #cmd-row { display: flex; gap: 6px; }
  #cmd-input { flex: 1; background: rgba(10,20,40,0.8); border: 1px solid #1a3a5a; color: #c8e0f8; padding: 7px 10px; font-family: inherit; font-size: 12px; border-radius: 4px; outline: none; }
  #cmd-input:focus { border-color: #2a6aaa; }
  #cmd-btn { background: #1a3a6a; border: 1px solid #2a5a9a; color: #8ab8e8; padding: 7px 14px; font-family: inherit; font-size: 11px; border-radius: 4px; cursor: pointer; }
  #cmd-btn:hover { background: #2a5a9a; }

  #tooltip { position: absolute; background: rgba(5,10,30,0.95); border: 1px solid #2a4a6a; padding: 8px 12px; border-radius: 6px; font-size: 11px; pointer-events: none; display: none; z-index: 100; max-width: 200px; }
  #tooltip .tt-name { color: #e8f4ff; font-weight: bold; margin-bottom: 4px; }
  #tooltip .tt-info { color: #6a9acc; font-size: 10px; }

  .mode-walk     { background: rgba(40,160,80,0.25);  color: #50d090; border: 1px solid #30a060; }
  .mode-cycle    { background: rgba(60,160,60,0.25);  color: #60d060; border: 1px solid #40a040; }
  .mode-drive    { background: rgba(200,160,40,0.25); color: #f0c050; border: 1px solid #c09030; }
  .mode-rail     { background: rgba(40,120,220,0.25); color: #60a8f8; border: 1px solid #3080d0; }
  .mode-flight   { background: rgba(80,180,240,0.25); color: #80d8ff; border: 1px solid #40a8d0; }
  .mode-orbit    { background: rgba(160,80,240,0.25); color: #c060ff; border: 1px solid #9040c0; }
  .mode-warp     { background: rgba(240,60,120,0.25); color: #ff6090; border: 1px solid #c03060; }
  .mode-quantum  { background: rgba(200,80,240,0.25); color: #e060ff; border: 1px solid #a030c0; }
  .mode-timeline { background: rgba(80,220,200,0.25); color: #50ddc8; border: 1px solid #30a898; }

  #loading { position: fixed; inset: 0; background: #050510; display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 16px; }
  #loading p { color: #4a7aaa; letter-spacing: 4px; font-size: 12px; text-transform: uppercase; }
  .spinner { width: 40px; height: 40px; border: 2px solid #1a2a4a; border-top-color: #4a8acc; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Initialising Reality…</p></div>
<div id="ui">
  <div id="canvas-container">
    <div id="tooltip"><div class="tt-name"></div><div class="tt-info"></div></div>
  </div>
  <div id="sidebar">
    <div id="coord-panel">
      <h2>Reality Coordinate</h2>
      <div id="onto-address"></div>
      <div class="coord-row"><span class="coord-label">Timeline</span><span class="coord-value" id="c-timeline"></span></div>
      <div class="coord-row"><span class="coord-label">Quantum</span><span class="coord-value" id="c-quantum"></span></div>
      <div class="coord-row"><span class="coord-label">Planet</span><span class="coord-value" id="c-planet"></span></div>
      <div class="coord-row"><span class="coord-label">City</span><span class="coord-value" id="c-city"></span></div>
      <div id="cost-display">Journey cost: <span id="c-cost">0</span></div>
    </div>
    <div id="info-panel">
      <h2>Current Location</h2>
      <div id="location-name"></div>
      <div id="location-desc"></div>
    </div>
    <div id="exits-panel">
      <h2>Exits</h2>
      <div id="exits-list"></div>
    </div>
    <div id="history-panel">
      <h2>Travel History</h2>
      <div id="history-list"></div>
    </div>
    <div id="command-area">
      <div id="output"></div>
      <div id="cmd-row">
        <input id="cmd-input" type="text" placeholder="travel station · shift · jump · help" autocomplete="off" spellcheck="false">
        <button id="cmd-btn">Go</button>
      </div>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── scene setup ────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x050510, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
camera.position.set(0, 0, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 20;
controls.maxDistance = 600;

// Ambient + point lights
scene.add(new THREE.AmbientLight(0x223355, 2));
const pLight = new THREE.PointLight(0x4488ff, 3, 300);
pLight.position.set(0, 60, 60);
scene.add(pLight);

// Starfield background
const starGeo = new THREE.BufferGeometry();
const starCount = 2000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 1200;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x334466, size: 0.4 })));

// ─── colour palette by travel mode ──────────────────────────────────────────
const modeColor = {
  walk:     0x30c070, cycle:    0x50d050, drive:  0xf0b040,
  rail:     0x4090f0, flight:   0x60d8ff, orbit:  0xb050ff,
  warp:     0xff5080, quantum:  0xd050ff, timeline: 0x40d8c0,
};
const modeColorHex = {
  walk:'#30c070', cycle:'#50d050', drive:'#f0b040', rail:'#4090f0',
  flight:'#60d8ff', orbit:'#b050ff', warp:'#ff5080', quantum:'#d050ff',
  timeline:'#40d8c0',
};

// ─── graph state ────────────────────────────────────────────────────────────
let nodes = {};       // id → { data, mesh, labelSprite, pos:{x,y,z}, vel:{x,y,z} }
let edges = [];       // [ {from, to, mode, line} ]
let currentLocation = '';
let universeData = { nodes: [], edges: [] };

// ─── force-directed layout ───────────────────────────────────────────────────
function quantumLayer(q) {
  if (!q) return 0;
  const m = q.match(/Q(\d+)/);
  return m ? parseInt(m[1]) : 0;
}
function timelineLayer(t) {
  if (!t || t === 'Prime') return 0;
  const m = t.match(/T(\d+)/);
  return m ? parseInt(m[1]) : 0;
}

function layoutNodes() {
  const ids = Object.keys(nodes);
  // Assign initial positions in a sphere, stratified by timeline/quantum
  ids.forEach(id => {
    const n = nodes[id];
    const tl = timelineLayer(n.data.timeline) * 30;
    const ql = quantumLayer(n.data.quantum) * 20;
    if (!n.pos) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 30 + Math.random() * 20;
      n.pos = { x: r * Math.sin(phi) * Math.cos(theta), y: ql + tl, z: r * Math.sin(phi) * Math.sin(theta) };
      n.vel = { x: 0, y: 0, z: 0 };
    }
  });
}

function simulateForces() {
  const ids = Object.keys(nodes);
  const k = 18, repel = 400, damping = 0.85;
  // Repulsion
  for (let i = 0; i < ids.length; i++) {
    for (let j = i + 1; j < ids.length; j++) {
      const a = nodes[ids[i]], b = nodes[ids[j]];
      const dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y, dz = b.pos.z - a.pos.z;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz) + 0.1;
      const f = repel / (d * d);
      const fx = f*dx/d, fy = f*dy/d, fz = f*dz/d;
      a.vel.x -= fx; a.vel.y -= fy; a.vel.z -= fz;
      b.vel.x += fx; b.vel.y += fy; b.vel.z += fz;
    }
  }
  // Attraction along edges
  edges.forEach(e => {
    const a = nodes[e.from], b = nodes[e.to];
    if (!a || !b) return;
    const dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y, dz = b.pos.z - a.pos.z;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz) + 0.1;
    const f = (d - k) * 0.03;
    const fx = f*dx/d, fy = f*dy/d, fz = f*dz/d;
    a.vel.x += fx; a.vel.y += fy; a.vel.z += fz;
    b.vel.x -= fx; b.vel.y -= fy; b.vel.z -= fz;
  });
  // Y-axis gravity toward timeline/quantum layer
  ids.forEach(id => {
    const n = nodes[id];
    const tl = timelineLayer(n.data.timeline) * 30;
    const ql = quantumLayer(n.data.quantum) * 20;
    n.vel.y += (tl + ql - n.pos.y) * 0.04;
  });
  // Integrate
  ids.forEach(id => {
    const n = nodes[id];
    n.vel.x *= damping; n.vel.y *= damping; n.vel.z *= damping;
    n.pos.x += n.vel.x; n.pos.y += n.vel.y; n.pos.z += n.vel.z;
    if (n.mesh) n.mesh.position.set(n.pos.x, n.pos.y, n.pos.z);
    if (n.labelSprite) n.labelSprite.position.set(n.pos.x, n.pos.y + 3.5, n.pos.z);
  });
  // Update edge lines
  edges.forEach(e => {
    const a = nodes[e.from], b = nodes[e.to];
    if (!a || !b || !e.line) return;
    const pos = e.line.geometry.attributes.position;
    pos.setXYZ(0, a.pos.x, a.pos.y, a.pos.z);
    pos.setXYZ(1, b.pos.x, b.pos.y, b.pos.z);
    pos.needsUpdate = true;
  });
}

// ─── label sprites ────────────────────────────────────────────────────────────
function makeLabel(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 20px Courier New';
  ctx.fillStyle = '#c8e0f8';
  ctx.textAlign = 'center';
  ctx.fillText(text, 128, 40);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(14, 3.5, 1);
  return sprite;
}

// ─── build / rebuild scene objects ──────────────────────────────────────────
function rebuildScene(graph) {
  universeData = graph;
  // Remove old meshes/lines
  Object.values(nodes).forEach(n => {
    if (n.mesh) scene.remove(n.mesh);
    if (n.labelSprite) scene.remove(n.labelSprite);
  });
  edges.forEach(e => { if (e.line) scene.remove(e.line); });
  edges = [];

  // Build node map (preserve existing positions)
  const prevNodes = nodes;
  nodes = {};
  graph.nodes.forEach(nd => {
    const prev = prevNodes[nd.id];
    nodes[nd.id] = { data: nd, mesh: null, labelSprite: null, pos: prev ? prev.pos : null, vel: prev ? prev.vel : null };
  });

  layoutNodes();

  // Create meshes
  Object.entries(nodes).forEach(([id, n]) => {
    const isCurrent = id === currentLocation;
    const isQuantum = n.data.quantum && n.data.quantum !== 'Q0';
    const isTimeline = n.data.timeline && n.data.timeline !== 'Prime';

    const size = isCurrent ? 3.2 : 2.0;
    const geo = new THREE.SphereGeometry(size, 24, 24);

    let color = 0x3060a0;
    if (isTimeline) color = 0x20a898;
    if (isQuantum) color = 0x9030c0;
    if (isTimeline && isQuantum) color = 0x2090c0;
    if (isCurrent) color = 0xffffff;

    const mat = new THREE.MeshStandardMaterial({
      color, emissive: isCurrent ? 0x8888ff : color,
      emissiveIntensity: isCurrent ? 1.2 : 0.3,
      metalness: 0.4, roughness: 0.3,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(n.pos.x, n.pos.y, n.pos.z);
    mesh.userData = { id };
    scene.add(mesh);
    n.mesh = mesh;

    const label = makeLabel(n.data.name || id);
    label.position.set(n.pos.x, n.pos.y + 3.5, n.pos.z);
    scene.add(label);
    n.labelSprite = label;

    // Glow ring for current location
    if (isCurrent) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(3.8, 4.4, 32),
        new THREE.MeshBasicMaterial({ color: 0x8888ff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
      );
      ring.rotation.x = Math.PI / 2;
      mesh.add(ring);
    }
  });

  // Create edges
  graph.edges.forEach(e => {
    const col = modeColor[e.mode] || 0x336688;
    const mat = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.5 });
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(6);
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    edges.push({ ...e, line });
  });
}

// ─── raycasting for hover/click ───────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hoveredId = null;

function getMeshes() { return Object.values(nodes).filter(n => n.mesh).map(n => n.mesh); }

container.addEventListener('mousemove', ev => {
  const rect = container.getBoundingClientRect();
  mouse.x = ((ev.clientX - rect.left) / container.clientWidth) * 2 - 1;
  mouse.y = -((ev.clientY - rect.top) / container.clientHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(getMeshes());
  if (hits.length) {
    const id = hits[0].object.userData.id;
    hoveredId = id;
    const nd = nodes[id].data;
    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX - rect.left + 14) + 'px';
    tooltip.style.top = (ev.clientY - rect.top - 10) + 'px';
    tooltip.querySelector('.tt-name').textContent = nd.name || id;
    tooltip.querySelector('.tt-info').textContent = nd.timeline + ' · ' + nd.quantum;
    container.style.cursor = 'pointer';
  } else {
    hoveredId = null;
    tooltip.style.display = 'none';
    container.style.cursor = '';
  }
});

container.addEventListener('click', ev => {
  if (!hoveredId || hoveredId === currentLocation) return;
  sendCommand('travel ' + hoveredId);
});

// ─── UI helpers ───────────────────────────────────────────────────────────────
function updateSidebar(state, graph) {
  document.getElementById('onto-address').textContent = state.ontoAddress;
  document.getElementById('c-timeline').textContent = state.timeline;
  document.getElementById('c-quantum').textContent = state.quantum;
  const nodeInfo = graph.nodes.find(n => n.id === state.location);
  document.getElementById('c-planet').textContent = nodeInfo ? nodeInfo.planet : '';
  document.getElementById('c-city').textContent = nodeInfo ? nodeInfo.city : '';
  document.getElementById('c-cost').textContent = Math.round(state.cumulativeCost);
  document.getElementById('location-name').textContent = nodeInfo ? nodeInfo.name : state.location;
  document.getElementById('location-desc').textContent = nodeInfo ? nodeInfo.description : '';

  // Exits
  const exitsList = document.getElementById('exits-list');
  exitsList.innerHTML = '';
  graph.edges.filter(e => e.from === state.location).forEach(e => {
    const dest = graph.nodes.find(n => n.id === e.to);
    const div = document.createElement('div');
    div.className = 'exit-item';
    div.innerHTML = `<span class="exit-name">${dest ? dest.name : e.to}</span><span class="exit-mode mode-${e.mode}">${e.mode}</span>`;
    div.addEventListener('click', () => {
      if (['quantum','timeline'].includes(e.mode)) {
        sendCommand(e.mode === 'quantum' ? 'shift' : 'jump');
      } else {
        sendCommand('travel ' + e.to);
      }
    });
    exitsList.appendChild(div);
  });

  // History
  const histList = document.getElementById('history-list');
  histList.innerHTML = '';
  (state.history || []).slice().reverse().forEach(h => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.textContent = h;
    histList.appendChild(div);
  });
}

function appendOutput(text) {
  const el = document.getElementById('output');
  el.textContent = text;
  el.scrollTop = el.scrollHeight;
}

// ─── API calls ───────────────────────────────────────────────────────────────
async function sendCommand(cmd) {
  const resp = await fetch('/api/command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: cmd }),
  });
  const data = await resp.json();
  currentLocation = data.state.location;
  rebuildScene(data.universe);
  updateSidebar(data.state, data.universe);
  appendOutput(data.output);
}

async function init() {
  const [stateResp, uniResp] = await Promise.all([fetch('/api/state'), fetch('/api/universe')]);
  const state = await stateResp.json();
  const graph = await uniResp.json();
  currentLocation = state.location;
  rebuildScene(graph);
  updateSidebar(state, graph);
  document.getElementById('loading').style.display = 'none';
}

// ─── command input ────────────────────────────────────────────────────────────
const input = document.getElementById('cmd-input');
const btn = document.getElementById('cmd-btn');

async function submitCommand() {
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  await sendCommand(cmd);
}
btn.addEventListener('click', submitCommand);
input.addEventListener('keydown', e => { if (e.key === 'Enter') submitCommand(); });

// ─── resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ─── animation loop ───────────────────────────────────────────────────────────
let simTicks = 0;
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (simTicks < 300) { simulateForces(); simTicks++; }
  // Pulse current location mesh
  const cur = nodes[currentLocation];
  if (cur && cur.mesh) {
    const t = Date.now() * 0.003;
    cur.mesh.material.emissiveIntensity = 0.8 + 0.4 * Math.sin(t);
  }
  renderer.render(scene, camera);
}

init().then(animate);
</script>
</body>
</html>
